databases:
  # Render Postgres (optional - you're already using Neon, so comment this out)
  # - name: library-db
  #   plan: free
  #   databaseName: librarydb
  #   user: libraryuser

services:
  - type: web
    name: library-management-system
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: FINE_PER_DAY
        value: "2"
      - key: GRACE_PERIOD_DAYS
        value: "0"
      - key: DEFAULT_ISSUE_DAYS
        value: "14"
      - key: RFID_EMAIL_NOTIFY
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLIENT_URL
        sync: false  # Set to your Render URL after first deploy
